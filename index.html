<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VK Content Manager</title>
<style>
:root{--bg:#0e0f11;--panel:#18191c;--line:#2a2c31;--text:#f1f2f4;--mute:#9a9ea8;--accent:#3d8bff;--ok:#3ecf6e;--err:#ff5a50;--warn:#f0a030;--r:10px}
[data-theme=light]{--bg:#f3f4f6;--panel:#fff;--line:#dfe1e6;--text:#16181d;--mute:#626874;--accent:#0a63e0;--ok:#16883f;--err:#d4372c;--warn:#a86400}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;font-weight:650}
.mute{color:var(--mute);font-size:14px}
header{margin-bottom:18px}
.bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-bottom:14px}
.tabs,.acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px}
.tabs button{border:0;background:none;color:var(--mute);padding:7px 18px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 16px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.err{border-color:var(--err);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:10px}
input,select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font:inherit}
input{flex:1 1 240px}select{flex:0 1 190px}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex-basis:100%}
.chip{border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:4px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.bar-track{height:6px;background:var(--line);border-radius:3px;margin:10px 0;overflow:hidden}
#fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:10px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:1px 6px;border-radius:4px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.title,.text{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.title{-webkit-line-clamp:2;font-weight:600}
.text{-webkit-line-clamp:4}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:13px;color:var(--mute);margin-top:auto}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
.empty{text-align:center;padding:56px 16px;color:var(--mute)}
.empty b{display:block;color:var(--text);font-size:1.1rem;margin-bottom:4px}
.more{display:block;margin:22px auto 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;max-width:90vw;transition:.2s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:var(--ok)}.toast.warn{border-color:var(--warn)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>VK Content Manager</h1>
    <p class="mute" id="status" aria-live="polite">Connecting to VK…</p>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="Content type">
      <button data-mode="video" aria-pressed="true">Videos</button>
      <button data-mode="post" aria-pressed="false">Posts</button>
    </div>
    <div class="acts">
      <button class="btn primary" id="indexBtn"></button>
      <button class="btn" id="demoBtn">Preview with demo data</button>
      <button class="btn" id="exportBtn">Export CSV</button>
    </div>
  </div>

  <div class="panel" id="progress" hidden>
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
      <span id="progText" aria-live="polite"></span>
      <button class="btn" id="cancelBtn">Stop</button>
    </div>
    <div class="bar-track"><div id="fill"></div></div>
  </div>

  <div class="panel err" id="err" role="alert" hidden>
    <span id="errMsg"></span>
    <button class="btn" id="retryBtn">Try again</button>
  </div>

  <div class="panel filters">
    <input id="q" type="search" placeholder="Search your content" aria-label="Search">
    <select id="type" aria-label="Filter"></select>
    <select id="sort" aria-label="Sort"></select>
    <div class="chips" id="chips"></div>
  </div>

  <p class="mute" id="summary" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <button class="btn more" id="more" hidden>Show more</button>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const timeout = ms => new Promise((_, no) => setTimeout(() => no(new Error('Timed out')), ms));

const CFG = {
  APP_ID: 53969951, MAX: 5000, BATCH: 100, PAGE: 48, DELAY: 350, RETRIES: 3,
  // vk-bridge exposes window.vkBridge (not `bridge`); fall back to a second CDN if the first fails
  BRIDGES: [
    'https://unpkg.com/@vkontakte/vk-bridge@2.7.0/dist/browser.min.js',
    'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.7.0/dist/browser.min.js'
  ]
};
const TYPES = ['text', 'photo', 'video', 'link', 'audio', 'document'];
const DAYS = { week: 7, month: 30, year: 365 };

const MODES = {
  video: {
    method: 'fave.get', params: { item_type: 'video' }, scope: '',
    types: [['', 'All resolutions'], ['4K', '4K'], ['1080p', '1080p'], ['720p', '720p'], ['480p', '480p'], ['360p', '360p'], ['Unknown', 'Unknown']],
    chips: { duration: [['short', 'Under 5 min'], ['medium', '5–20 min'], ['long', 'Over 20 min']] },
    sorts: [['saved', 'Recently added'], ['savedOld', 'Earliest added'], ['newest', 'Newest upload'], ['oldest', 'Oldest upload'], ['top', 'Most views'], ['low', 'Fewest views'], ['longest', 'Longest'], ['shortest', 'Shortest'], ['az', 'Title A–Z']]
  },
  post: {
    method: 'wall.get', params: {}, scope: 'wall',
    types: [['', 'All types'], ...TYPES.map(t => [t, t[0].toUpperCase() + t.slice(1)])],
    chips: { date: [['week', 'Past 7 days'], ['month', 'Past 30 days'], ['year', 'Past year']] },
    sorts: [['newest', 'Newest'], ['oldest', 'Oldest'], ['top', 'Most likes'], ['low', 'Fewest likes'], ['comments', 'Most comments'], ['quiet', 'Fewest comments']]
  }
};

const ts = i => Date.parse(i.date) || 0;
const SORT = {
  saved: (a, b) => (b.saved || 0) - (a.saved || 0),
  savedOld: (a, b) => (a.saved || 0) - (b.saved || 0),
  az: (a, b) => (a.title || '').localeCompare(b.title || ''),
  newest: (a, b) => ts(b) - ts(a),
  oldest: (a, b) => ts(a) - ts(b),
  top: (a, b) => (b.views ?? b.likes) - (a.views ?? a.likes),
  low: (a, b) => (a.views ?? a.likes) - (b.views ?? b.likes),
  longest: (a, b) => b.durationSeconds - a.durationSeconds,
  shortest: (a, b) => a.durationSeconds - b.durationSeconds,
  comments: (a, b) => b.comments - a.comments,
  quiet: (a, b) => a.comments - b.comments
};

const S = {
  mode: 'video', source: 'live', items: [], view: [], shown: CFG.PAGE, updated: null,
  token: null, user: null, bridge: null, busy: false, cancel: false,
  f: { q: '', type: '', sort: 'newest', chip: {} }
};

/* ---------- formatting ---------- */
const iso = s => s ? new Date(s * 1000).toISOString() : '';
const fmtNum = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n || 0);
const fmtDate = d => { const t = Date.parse(d); return t ? new Date(t).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : ''; };
const fmtDur = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const durClass = s => s < 300 ? 'Short' : s <= 1200 ? 'Medium' : 'Long';
const res = (w, h) => { const m = Math.min(w || 0, h || 0); return !m ? 'Unknown' : m >= 2160 ? '4K' : m >= 1080 ? '1080p' : m >= 720 ? '720p' : m >= 480 ? '480p' : m >= 360 ? '360p' : 'Unknown'; };

/* ---------- storage (demo and live data never mix) ---------- */
const key = (m = S.mode, src = S.source) => `vkcm:${src}:${m}`;
function save(items, m = S.mode, src = S.source) {
  const put = x => localStorage.setItem(key(m, src), JSON.stringify({ t: Date.now(), items: x }));
  try { put(items); }
  catch {
    try { put(items.map(i => ({ ...i, thumb: '' }))); toast('Storage is nearly full, so thumbnails were not saved.', 'warn'); }
    catch { toast('Could not save on this device. Results will be lost when you close the app.', 'warn'); }
  }
}
function load(m = S.mode, src = S.source) {
  try { return JSON.parse(localStorage.getItem(key(m, src))); } catch { return null; }
}

/* ---------- UI helpers ---------- */
let tt;
function toast(msg, type = '') {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(tt); tt = setTimeout(() => t.className = 'toast', 3500);
}
const setStatus = s => $('#status').textContent = s;
function fail(msg) { $('#errMsg').textContent = msg; $('#err').hidden = false; }
function progress(text, pct) { $('#progress').hidden = false; $('#progText').textContent = text; $('#fill').style.width = Math.round(pct * 100) + '%'; }
function setTheme(scheme) { document.documentElement.dataset.theme = String(scheme).includes('light') ? 'light' : 'dark'; }
const errMsg = e => {
  const r = e?.error_data?.error_reason;
  return (typeof r === 'string' ? r : r?.error_msg) || e?.error_data?.error_description || e?.message || 'Unknown error';
};

/* ---------- VK Bridge ---------- */
function loadScript(u) {
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = u; s.onload = ok; s.onerror = () => no(new Error('Script failed to load'));
    document.head.appendChild(s);
  });
}
async function initBridge() {
  for (const u of CFG.BRIDGES) { if (window.vkBridge) break; try { await loadScript(u); } catch {} }
  const b = window.vkBridge;
  if (!b) return setStatus('Standalone preview. VK Bridge could not be loaded.');
  try {
    b.subscribe(e => { const d = e.detail; if (d?.type === 'VKWebAppUpdateConfig' && d.data?.scheme) setTheme(d.data.scheme); });
    await Promise.race([b.send('VKWebAppInit'), timeout(5000)]);
    S.bridge = b;
    try { S.user = await b.send('VKWebAppGetUserInfo'); } catch {}
    if (S.source === 'live') setStatus(S.user ? `Connected to VK as ${S.user.first_name} ${S.user.last_name}` : 'Connected to VK');
  } catch {
    setStatus('Standalone preview. Open this app inside VK to index your own content.');
  }
}
// Permissions are requested when the person taps "Index", not on page load
async function ensureToken(scope) {
  S.tok = S.tok || {};
  if (!S.tok[scope]) {
    const r = await S.bridge.send('VKWebAppGetAuthToken', { app_id: CFG.APP_ID, scope });
    if (!r.access_token) throw new Error('VK did not grant access.');
    S.tok[scope] = r.access_token;
  }
  return S.token = S.tok[scope];
}
async function api(method, params) {
  for (let i = 1; ; i++) {
    try {
      const r = await S.bridge.send('VKWebAppCallAPIMethod', { method, params: { ...params, access_token: S.token, v: '5.199' } });
      return r.response;
    } catch (e) {
      if (i >= CFG.RETRIES || S.cancel) throw e;
      await sleep(1000 * i);
    }
  }
}

/* ---------- indexing ---------- */
const NORM = {
  video: v => ({
    id: v.id, url: `https://vk.com/video${+v.owner_id}_${+v.id}`, title: v.title || 'Untitled video',
    durationSeconds: v.duration || 0, views: v.views || 0, date: iso(v.date),
    resolution: res(v.width, v.height), thumb: v.image?.length ? v.image[v.image.length - 1].url : (v.photo_320 || '')
  }),
  post: p => {
    const a = p.attachments?.[0], t = a?.type === 'doc' ? 'document' : (a?.type || 'text');
    return {
      id: p.id, url: `https://vk.com/wall${+p.owner_id}_${+p.id}`, text: p.text || '',
      likes: p.likes?.count || 0, comments: p.comments?.count || 0, reposts: p.reposts?.count || 0,
      date: iso(p.date), contentType: TYPES.includes(t) ? t : 'text',
      thumb: a?.photo?.sizes?.slice(-1)[0]?.url || ''
    };
  }
};

async function indexContent() {
  if (S.busy) return;
  $('#err').hidden = true;
  if (S.source === 'demo') return toast('Exit demo mode to index your own content.', 'warn');
  if (!navigator.onLine) return fail('You are offline. Reconnect and try again.');
  if (!S.bridge) return fail('VK is not connected. Open this app inside VK, or preview it with demo data.');
  const mode = S.mode;
  S.busy = true; S.cancel = false; $('#indexBtn').disabled = true;
  try {
    progress('Waiting for VK permission…', 0);
    await ensureToken(MODES[mode].scope);
    const out = []; let total = CFG.MAX, off = 0;
    while (off < Math.min(total, CFG.MAX) && !S.cancel) {
      const r = await api(MODES[mode].method, { ...MODES[mode].params, count: CFG.BATCH, offset: off });
      total = r.count ?? total;
      const batch = (r.items || []).filter(it => it.video || it.post || it.id).map(it => ({ ...NORM[mode](it.video || it.post || it), saved: it.added_date || 0 }));
      out.push(...batch); off += CFG.BATCH;
      const goal = Math.min(total, CFG.MAX) || 1;
      progress(`Indexed ${out.length} of ${goal}`, out.length / goal);
      if (!(r.items || []).length) break;
      await sleep(CFG.DELAY);
    }
    if (out.length) {
      save(out, mode);
      if (S.mode === mode) loadMode();
    }
    toast(S.cancel ? `Stopped at ${out.length} items.` : `Indexed ${out.length} ${mode}s.`, S.cancel ? 'warn' : 'ok');
  } catch (e) {
    fail(`Indexing failed: ${errMsg(e)}`);
  } finally {
    S.busy = false; $('#indexBtn').disabled = false; $('#progress').hidden = true;
  }
}

/* ---------- demo data ---------- */
function makeDemo() {
  const R = ['4K', '1080p', '720p', '480p', '360p'], D = [154, 345, 750, 1500, 495, 1102, 225, 2110];
  const VT = ['Tutorial series', 'Day in the city', 'Gadget review', 'Cover performance', 'Stream highlights', 'Easy recipes', 'Paris travel vlog', 'Weekly tech news'];
  const PT = ['Perfect weather and a productive day.', 'New project announcement coming soon.', 'Every expert was once a beginner.', 'Take regular breaks. It raises productivity.', 'Sharing what I learned this week. Tell me what you think.'];
  const rnd = n => Math.floor(Math.random() * n), day = () => new Date(Date.now() - Math.random() * 365 * 864e5).toISOString();
  const N = Array.from({ length: 48 }, (_, i) => i);
  save(N.map(i => ({ id: i, title: `${VT[i % 8]} #${i + 1}`, durationSeconds: D[i % 8], views: 100 + rnd(50000), date: day(), resolution: R[i % 5], thumb: '', saved: Math.floor(Date.now() / 1000) - rnd(3e7) })), 'video', 'demo');
  save(N.map(i => ({ id: i, text: PT[i % 5], likes: rnd(1000), comments: rnd(200), reposts: rnd(100), date: day(), contentType: TYPES[i % 6], thumb: '' })), 'post', 'demo');
}
function toggleDemo() {
  if (S.busy) return;
  S.source = S.source === 'demo' ? 'live' : 'demo';
  if (S.source === 'demo' && !load('video')) makeDemo();
  $('#demoBtn').textContent = S.source === 'demo' ? 'Exit demo' : 'Preview with demo data';
  setStatus(S.source === 'demo' ? 'Demo data. This is sample content, not yours.' : (S.user ? `Connected to VK as ${S.user.first_name} ${S.user.last_name}` : 'Standalone preview'));
  loadMode();
}

/* ---------- filtering and rendering ---------- */
function buildControls() {
  const m = MODES[S.mode];
  $('#type').innerHTML = m.types.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  $('#sort').innerHTML = m.sorts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  S.f.sort = m.sorts[0][0]; $('#sort').value = S.f.sort;
  $('#chips').innerHTML = Object.entries(m.chips).flatMap(([g, o]) => o.map(([v, l]) => `<button class="chip" data-g="${g}" data-v="${v}" aria-pressed="false">${esc(l)}</button>`)).join('');
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.mode));
  $('#indexBtn').textContent = S.mode === 'video' ? 'Index liked videos' : 'Index my posts';
}
function loadMode() {
  const c = load();
  S.items = c?.items || []; S.updated = c?.t || null; S.shown = CFG.PAGE;
  apply();
}
function apply() {
  const f = S.f, q = f.q.trim().toLowerCase(), now = Date.now();
  S.view = S.items.filter(i => {
    if (q && !(i.title || i.text || '').toLowerCase().includes(q)) return false;
    if (f.type && (i.resolution || i.contentType) !== f.type) return false;
    const d = f.chip.duration, s = i.durationSeconds;
    if (d && (d === 'short' ? s >= 300 : d === 'medium' ? (s < 300 || s > 1200) : s <= 1200)) return false;
    const w = f.chip.date;
    if (w && now - ts(i) > DAYS[w] * 864e5) return false;
    return true;
  }).sort(SORT[f.sort]);
  render();
}
function card(i) {
  const v = S.mode === 'video';
  const img = /^https:\/\//.test(i.thumb) ? `<img src="${esc(i.thumb)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  const thumb = v ? `<div class="thumb">${img}<span class="dur">${fmtDur(i.durationSeconds)}</span></div>` : (img ? `<div class="thumb">${img}</div>` : '');
  const body = v
    ? `<div class="title">${esc(i.title)}</div><div class="meta"><span>${fmtNum(i.views)} views</span><span>${esc(durClass(i.durationSeconds))}</span><span class="tag">${esc(i.resolution)}</span><span>${esc(fmtDate(i.date))}</span></div>`
    : `<div class="text">${esc(i.text) || '<span class="mute">No text</span>'}</div><div class="meta"><span>${fmtNum(i.likes)} likes</span><span>${fmtNum(i.comments)} comments</span><span>${fmtNum(i.reposts)} reposts</span><span class="tag">${esc(i.contentType)}</span><span>${esc(fmtDate(i.date))}</span></div>`;
  const inner = `${thumb}<div class="body">${body}</div>`;
  return S.source === 'live' && i.url ? `<a class="card" href="${esc(i.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="card">${inner}</div>`;
}
function render() {
  const n = S.items.length, noun = S.mode + 's';
  $('#grid').innerHTML = S.view.slice(0, S.shown).map(card).join('');
  $('#more').hidden = S.shown >= S.view.length;
  $('#summary').textContent = n ? `${S.view.length} of ${n} ${noun} match.` + (S.updated ? ` Updated ${new Date(S.updated).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}.` : '') : '';
  const e = $('#empty');
  e.hidden = S.view.length > 0;
  e.innerHTML = n ? '<b>No matches</b>Clear the search or filters to see more.' : `<b>No ${noun} indexed yet</b>Select “${$('#indexBtn').textContent}” to load them from VK, or preview the app with demo data.`;
}
function exportCsv() {
  if (!S.view.length) return toast('Nothing to export.', 'warn');
  const cols = Object.keys(S.view[0]).filter(k => k !== 'thumb');
  const cell = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const csv = [cols.join(','), ...S.view.map(r => cols.map(c => cell(r[c])).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = `vk-${S.mode}s.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded', () => {
  setTheme(matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  buildControls(); loadMode();

  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    S.mode = b.dataset.mode; S.f = { q: S.f.q, type: '', sort: 'newest', chip: {} };
    buildControls(); loadMode();
  });
  let deb; $('#q').oninput = e => { clearTimeout(deb); deb = setTimeout(() => { S.f.q = e.target.value; S.shown = CFG.PAGE; apply(); }, 200); };
  $('#type').onchange = e => { S.f.type = e.target.value; S.shown = CFG.PAGE; apply(); };
  $('#sort').onchange = e => { S.f.sort = e.target.value; S.shown = CFG.PAGE; apply(); };
  // Chips in the same group are exclusive, so "Short" and "Long" can no longer combine into zero results
  $('#chips').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const { g, v } = b.dataset;
    S.f.chip[g] = S.f.chip[g] === v ? undefined : v;
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', S.f.chip[c.dataset.g] === c.dataset.v));
    S.shown = CFG.PAGE; apply();
  };
  $('#more').onclick = () => { S.shown += CFG.PAGE; render(); };
  $('#indexBtn').onclick = indexContent;
  $('#retryBtn').onclick = indexContent;
  $('#cancelBtn').onclick = () => S.cancel = true;
  $('#demoBtn').onclick = toggleDemo;
  $('#exportBtn').onclick = exportCsv;
  addEventListener('online', () => toast('Back online.', 'ok'));
  addEventListener('offline', () => toast('You are offline. Saved content still works.', 'warn'));

  initBridge(); // cached content is already on screen while VK connects
});
</script>
</body>
</html>
